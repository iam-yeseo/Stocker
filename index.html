<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COASTAL RUSH — 해안도로 레이싱</title>
<style>
  :root{
    --sky-top:#7ec8e3; --sky-bot:#fdf3d8;
    --sea:#1d7a8c; --sand:#e8d9a8;
    --ink:#1d2a32; --paper:#fffdf6;
    --accent:#e8543f; --accent-dark:#b93a28;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:#10181d;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);
    overflow:hidden;
  }
  #wrap{position:relative; width:min(96vw, 960px);}
  canvas{
    display:block;width:100%;
    border-radius:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.55);
    background:#000;
  }
  /* ===== HUD ===== */
  #hud{
    position:absolute; inset:0; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:18px 22px;
  }
  .hud-row{display:flex; justify-content:space-between; align-items:flex-start;}
  .pill{
    background:rgba(255,253,246,.92);
    border:2px solid var(--ink);
    border-radius:10px;
    padding:7px 14px;
    box-shadow:3px 3px 0 rgba(29,42,50,.6);
  }
  .pill .label{font-size:10px; letter-spacing:.18em; font-weight:700; opacity:.55;}
  .pill .val{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.05;}
  .pill .unit{font-size:12px; font-weight:600; opacity:.6; margin-left:2px;}
  #speedPill .val{color:var(--accent-dark); font-size:30px;}
  #msg{
    position:absolute; left:50%; top:26%; transform:translateX(-50%);
    font-size:30px; font-weight:900; color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,.4);
    opacity:0; transition:opacity .25s;
    white-space:nowrap;
  }
  /* ===== 오버레이 (시작/게임오버) ===== */
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(16,24,29,.72); backdrop-filter:blur(3px);
    border-radius:14px; text-align:center; color:var(--paper);
    gap:14px;
  }
  .overlay.hidden{display:none;}
  .overlay h1{
    font-size:clamp(34px,6vw,58px); font-weight:900; letter-spacing:-.02em;
    color:#fff;
  }
  .overlay h1 em{font-style:normal; color:#ffb03a;}
  .overlay .sub{font-size:15px; opacity:.85; line-height:1.7;}
  .keys{
    display:flex; gap:18px; margin:6px 0 4px; flex-wrap:wrap; justify-content:center;
  }
  .keygroup{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; opacity:.9;}
  kbd{
    display:inline-block; min-width:34px; padding:6px 9px;
    background:var(--paper); color:var(--ink);
    border-radius:7px; border-bottom:3px solid #b9b2a0;
    font-weight:800; font-size:13px; text-align:center;
    font-family:inherit;
  }
  button{
    pointer-events:auto; cursor:pointer;
    font-family:inherit; font-weight:800; font-size:17px;
    color:#fff; background:var(--accent);
    border:none; border-radius:10px;
    padding:13px 38px;
    border-bottom:4px solid var(--accent-dark);
    transition:transform .08s;
  }
  button:hover{transform:translateY(-2px);}
  button:active{transform:translateY(1px); border-bottom-width:2px;}
  .result{
    display:flex; gap:26px; margin:4px 0;
  }
  .result div{text-align:center;}
  .result .rv{font-size:34px; font-weight:900; color:#ffb03a;}
  .result .rl{font-size:11px; letter-spacing:.15em; opacity:.7; margin-top:2px;}
  .hint{font-size:12px; opacity:.55; margin-top:4px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>

  <div id="hud">
    <div class="hud-row">
      <div class="pill" id="speedPill">
        <div class="label">SPEED</div>
        <div><span class="val" id="speedVal">0</span><span class="unit">km/h</span></div>
      </div>
      <div class="pill">
        <div class="label">TIME</div>
        <div><span class="val" id="timeVal">60.0</span></div>
      </div>
      <div class="pill">
        <div class="label">DISTANCE</div>
        <div><span class="val" id="distVal">0.0</span><span class="unit">km</span></div>
      </div>
    </div>
    <div class="hud-row">
      <div class="pill">
        <div class="label">SCORE</div>
        <div><span class="val" id="scoreVal">0</span></div>
      </div>
      <div class="pill">
        <div class="label">BEST</div>
        <div><span class="val" id="bestVal">0</span></div>
      </div>
    </div>
  </div>
  <div id="msg"></div>

  <div class="overlay" id="startOverlay">
    <h1>COASTAL <em>RUSH</em></h1>
    <div class="sub">해안도로를 달려 체크포인트에 도달하세요!<br>차량을 추월하면 보너스 점수, 충돌하면 속도가 크게 떨어집니다.</div>
    <div class="keys">
      <div class="keygroup"><div><kbd>↑</kbd> / <kbd>W</kbd></div>가속</div>
      <div class="keygroup"><div><kbd>↓</kbd> / <kbd>S</kbd></div>브레이크</div>
      <div class="keygroup"><div><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd></div>조향</div>
      <div class="keygroup"><div><kbd>P</kbd></div>일시정지</div>
    </div>
    <button id="startBtn">게임 시작</button>
  </div>

  <div class="overlay hidden" id="overOverlay">
    <h1 id="overTitle">TIME OVER</h1>
    <div class="result">
      <div><div class="rv" id="finalScore">0</div><div class="rl">SCORE</div></div>
      <div><div class="rv" id="finalDist">0.0</div><div class="rl">KM</div></div>
      <div><div class="rv" id="finalPass">0</div><div class="rl">추월</div></div>
    </div>
    <button id="retryBtn">다시 달리기</button>
    <div class="hint">R 키로도 재시작할 수 있어요</div>
  </div>
</div>

<script>
"use strict";
/* =========================================================
   COASTAL RUSH — pseudo-3D 해안도로 레이싱
   ========================================================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

/* ---------- 트랙 설정 ---------- */
const SEG_LEN   = 200;            // 세그먼트 길이
const RUMBLE    = 3;              // 럼블 스트립 묶음
const ROAD_W    = 2200;           // 도로 반폭
const DRAW_DIST = 220;            // 그릴 세그먼트 수
const CAM_H     = 1100;
const FOV       = 100;
const CAM_DEPTH = 1 / Math.tan((FOV/2) * Math.PI/180);
const LANES     = 3;

const MAX_SPEED   = SEG_LEN * 60 * 1.05;  // 내부 단위 속도
const ACCEL       = MAX_SPEED / 5.5;
const BRAKE       = -MAX_SPEED / 2.2;
const DECEL       = -MAX_SPEED / 6;
const OFFROAD_DECEL = -MAX_SPEED / 1.6;
const OFFROAD_LIMIT = MAX_SPEED / 4;

const CHECKPOINT_TIME = 45;       // 체크포인트마다 추가되는 시간(초)
const CHECKPOINT_DIST = 18000;    // 체크포인트 간격(세그먼트 z 단위 아님, 누적거리)

let segments = [];
let trackLength = 0;

function lastY(){ return segments.length ? segments[segments.length-1].p2.world.y : 0; }

function addSegment(curve, y){
  const n = segments.length;
  segments.push({
    index:n,
    p1:{ world:{ y:lastY(), z:n*SEG_LEN }, camera:{}, screen:{} },
    p2:{ world:{ y:y,        z:(n+1)*SEG_LEN }, camera:{}, screen:{} },
    curve:curve,
    cars:[],
    color: Math.floor(n/RUMBLE)%2
  });
}
function addRoad(enter, hold, leave, curve, hillY){
  const startY = lastY();
  const endY   = startY + hillY * SEG_LEN;
  const total  = enter + hold + leave;
  const easeIn  = t => t*t;
  const easeInOut = t => -Math.cos(t*Math.PI)/2 + .5;
  for(let i=0;i<enter;i++)  addSegment(curve*easeIn(i/enter),               startY + (endY-startY)*easeInOut(i/total));
  for(let i=0;i<hold;i++)   addSegment(curve,                               startY + (endY-startY)*easeInOut((enter+i)/total));
  for(let i=0;i<leave;i++)  addSegment(curve*(1-easeIn(i/leave)),           startY + (endY-startY)*easeInOut((enter+hold+i)/total));
}
const R = { NONE:0, EASY:2, MED:4, HARD:6 };
const L = { SHORT:25, MED:50, LONG:100 };
const HILL = { NONE:0, LOW:20, MED:40, HIGH:60 };

function buildTrack(){
  segments = [];
  addRoad(L.SHORT, L.LONG, L.SHORT, R.NONE, HILL.NONE);          // 직선 출발
  addRoad(L.MED, L.MED, L.MED,  R.EASY,  HILL.LOW);
  addRoad(L.MED, L.MED, L.MED, -R.MED,   HILL.NONE);
  addRoad(L.SHORT, L.MED, L.SHORT, R.NONE, -HILL.MED);
  addRoad(L.MED, L.LONG, L.MED,  R.HARD,  HILL.NONE);
  addRoad(L.MED, L.MED, L.MED, -R.EASY,  HILL.MED);
  addRoad(L.SHORT, L.SHORT, L.SHORT, R.NONE, HILL.NONE);
  addRoad(L.MED, L.LONG, L.MED, -R.HARD, -HILL.LOW);
  addRoad(L.MED, L.MED, L.MED,  R.MED,   HILL.HIGH);
  addRoad(L.MED, L.MED, L.MED,  R.EASY, -HILL.HIGH);
  addRoad(L.SHORT, L.LONG, L.SHORT, R.NONE, HILL.NONE);
  addRoad(L.MED, L.MED, L.MED, -R.MED,   HILL.LOW);
  trackLength = segments.length * SEG_LEN;
}

/* ---------- 차량(트래픽) ---------- */
const CAR_COLORS = [
  ['#3d7bd6','#2a5aa8'], ['#f2b134','#c98c1b'], ['#5cb56a','#3d8c4b'],
  ['#9b6dd6','#7649ad'], ['#e0e4e8','#aab2bb'], ['#37b8c4','#23919c']
];
let traffic = [];
function spawnTraffic(count){
  traffic = [];
  for(let i=0;i<count;i++){
    const offset = (Math.random()*1.6 - 0.8);
    const z = Math.random()*trackLength;
    const speed = MAX_SPEED * (0.18 + Math.random()*0.32);
    const color = CAR_COLORS[i % CAR_COLORS.length];
    const car = { offset, z, speed, color, passed:false };
    traffic.push(car);
  }
}

/* ---------- 게임 상태 ---------- */
const state = {
  running:false, paused:false, over:false,
  position:0,        // 트랙 z 위치
  playerX:0,         // -1 ~ 1
  speed:0,
  totalDist:0,
  timeLeft:60,
  score:0, best:0,
  passCount:0,
  nextCheckpoint:CHECKPOINT_DIST,
  shake:0
};
const keys = {};

addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if(e.key.toLowerCase()==='p' && state.running && !state.over) togglePause();
  if(e.key.toLowerCase()==='r' && state.over) startGame();
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

const up    = ()=> keys['arrowup']||keys['w'];
const down  = ()=> keys['arrowdown']||keys['s'];
const left  = ()=> keys['arrowleft']||keys['a'];
const right = ()=> keys['arrowright']||keys['d'];

/* ---------- 유틸 ---------- */
const clamp = (v,a,b)=> Math.max(a, Math.min(b,v));
const lerp  = (a,b,t)=> a+(b-a)*t;
function findSegment(z){
  return segments[Math.floor(z/SEG_LEN) % segments.length];
}
function project(p, camX, camY, camZ){
  p.camera.x = -camX;
  p.camera.y = p.world.y - camY;
  p.camera.z = p.world.z - camZ;
  if(p.camera.z <= 0) p.camera.z = 0.01;
  const scale = CAM_DEPTH / p.camera.z;
  p.screen.scale = scale;
  p.screen.x = Math.round(W/2 + scale * p.camera.x * W/2);
  p.screen.y = Math.round(H/2 - scale * p.camera.y * H/2);
  p.screen.w = Math.round(scale * ROAD_W * W/2);
}

/* ---------- 렌더링 ---------- */
const COLORS = {
  light:{ road:'#8c8c94', grass:'#b8cf7e', rumble:'#fffdf6', lane:'#fffdf6', sea:'#2a8fa3' },
  dark: { road:'#84848c', grass:'#a9c271', rumble:'#e8543f', lane:null,      sea:'#27889b' }
};

function drawPolygon(x1,y1,x2,y2,x3,y3,x4,y4,color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.lineTo(x4,y4);
  ctx.closePath(); ctx.fill();
}

function drawBackground(baseSeg, playerY){
  // 하늘
  const sky = ctx.createLinearGradient(0,0,0,H*0.62);
  sky.addColorStop(0,'#6cc0e0');
  sky.addColorStop(0.75,'#cfe9d8');
  sky.addColorStop(1,'#fdf3d8');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);
  // 태양
  ctx.fillStyle = 'rgba(255,236,170,.9)';
  ctx.beginPath(); ctx.arc(W*0.78, H*0.2, 46, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,236,170,.35)';
  ctx.beginPath(); ctx.arc(W*0.78, H*0.2, 70, 0, Math.PI*2); ctx.fill();
  // 먼 산
  ctx.fillStyle = '#8fb8a8';
  ctx.beginPath();
  ctx.moveTo(0,H*0.5);
  const off = (state.position/trackLength)*200 % W;
  for(let x=0;x<=W;x+=40){
    const h = Math.sin((x+off)*0.013)*30 + Math.sin((x+off)*0.004)*55;
    ctx.lineTo(x, H*0.46 - Math.max(0,h));
  }
  ctx.lineTo(W,H*0.5); ctx.closePath(); ctx.fill();
}

function drawCarSprite(x, y, w, colors, isPlayer, steer){
  // w = 화면상 차폭
  const h = w*0.62;
  ctx.save();
  ctx.translate(x, y);
  if(isPlayer) ctx.rotate(steer*0.05);
  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(0, h*0.06, w*0.55, h*0.16, 0, 0, Math.PI*2); ctx.fill();
  // 차체
  ctx.fillStyle = colors[1];
  roundRect(-w/2, -h*0.78, w, h*0.82, w*0.1); ctx.fill();
  ctx.fillStyle = colors[0];
  roundRect(-w/2*0.96, -h*0.84, w*0.96, h*0.74, w*0.1); ctx.fill();
  // 캐빈(유리)
  ctx.fillStyle = '#202c36';
  roundRect(-w*0.32, -h*0.74, w*0.64, h*0.3, w*0.07); ctx.fill();
  // 범퍼/후미등
  ctx.fillStyle = isPlayer ? '#ff5a45' : '#ffd76a';
  roundRect(-w*0.42, -h*0.26, w*0.16, h*0.1, 2); ctx.fill();
  roundRect( w*0.26, -h*0.26, w*0.16, h*0.1, 2); ctx.fill();
  // 타이어
  ctx.fillStyle = '#1a1f24';
  roundRect(-w*0.54, -h*0.2, w*0.12, h*0.22, 2); ctx.fill();
  roundRect( w*0.42, -h*0.2, w*0.12, h*0.22, 2); ctx.fill();
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function render(){
  const baseSeg = findSegment(state.position);
  const basePercent = (state.position % SEG_LEN) / SEG_LEN;
  const playerSeg = findSegment(state.position + CAM_DEPTH*CAM_H);
  const playerY = lerp(playerSeg.p1.world.y, playerSeg.p2.world.y, basePercent);

  const shakeX = (Math.random()-0.5)*state.shake;
  const shakeY = (Math.random()-0.5)*state.shake;
  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBackground(baseSeg, playerY);

  let maxY = H;
  let x = 0, dx = -(baseSeg.curve * basePercent);

  const camZ = state.position - (state.position % SEG_LEN);

  // 도로 + 지형
  for(let n=0; n<DRAW_DIST; n++){
    const seg = segments[(baseSeg.index + n) % segments.length];
    const looped = seg.index < baseSeg.index;
    const camAdjZ = camZ + (looped ? trackLength : 0);

    project(seg.p1, state.playerX*ROAD_W - x,      playerY + CAM_H, camAdjZ);
    project(seg.p2, state.playerX*ROAD_W - x - dx, playerY + CAM_H, camAdjZ);
    x += dx; dx += seg.curve;
    seg.clip = maxY;

    if(seg.p1.camera.z <= CAM_DEPTH || seg.p2.screen.y >= maxY || seg.p2.screen.y >= seg.p1.screen.y) continue;

    const c = seg.color ? COLORS.dark : COLORS.light;
    const p1 = seg.p1.screen, p2 = seg.p2.screen;

    // 왼쪽=바다, 오른쪽=초지
    ctx.fillStyle = c.sea;
    ctx.fillRect(0, p2.y, W, p1.y - p2.y);
    ctx.fillStyle = c.grass;
    ctx.fillRect(W/2, p2.y, W/2, p1.y - p2.y);
    // 도로 기준 좌우 분리: 도로 왼쪽 바깥은 바다, 오른쪽 바깥은 초지
    drawPolygon(p1.x - p1.w*1.0, p1.y, p1.x + p1.w*1.0, p1.y, p2.x + p2.w*1.0, p2.y, p2.x - p2.w*1.0, p2.y, c.grass);
    // 모래(바다쪽 경계)
    drawPolygon(p1.x - p1.w*1.25, p1.y, p1.x - p1.w*0.98, p1.y, p2.x - p2.w*0.98, p2.y, p2.x - p2.w*1.25, p2.y, '#e8d9a8');
    ctx.fillStyle = c.sea;
    ctx.beginPath();
    ctx.moveTo(0, p1.y); ctx.lineTo(p1.x - p1.w*1.25, p1.y);
    ctx.lineTo(p2.x - p2.w*1.25, p2.y); ctx.lineTo(0, p2.y);
    ctx.closePath(); ctx.fill();

    // 럼블
    drawPolygon(p1.x - p1.w*1.0, p1.y, p1.x - p1.w*0.94, p1.y, p2.x - p2.w*0.94, p2.y, p2.x - p2.w*1.0, p2.y, c.rumble);
    drawPolygon(p1.x + p1.w*0.94, p1.y, p1.x + p1.w*1.0, p1.y, p2.x + p2.w*1.0, p2.y, p2.x + p2.w*0.94, p2.y, c.rumble);
    // 도로
    drawPolygon(p1.x - p1.w*0.94, p1.y, p1.x + p1.w*0.94, p1.y, p2.x + p2.w*0.94, p2.y, p2.x - p2.w*0.94, p2.y, c.road);
    // 차선
    if(c.lane){
      const lw1 = p1.w*0.94*2/LANES, lw2 = p2.w*0.94*2/LANES;
      const lm1 = p1.w*0.01, lm2 = p2.w*0.01;
      for(let lane=1; lane<LANES; lane++){
        const lx1 = p1.x - p1.w*0.94 + lw1*lane;
        const lx2 = p2.x - p2.w*0.94 + lw2*lane;
        drawPolygon(lx1-lm1, p1.y, lx1+lm1, p1.y, lx2+lm2, p2.y, lx2-lm2, p2.y, c.lane);
      }
    }
    maxY = p2.y;
  }

  // 트래픽 (뒤에서 앞으로)
  for(let n=DRAW_DIST-1; n>0; n--){
    const seg = segments[(baseSeg.index + n) % segments.length];
    if(!seg.cars.length) continue;
    for(const car of seg.cars){
      const p = seg.p1;
      if(p.camera.z <= CAM_DEPTH) continue;
      const scale = p.screen.scale;
      const carX = p.screen.x + scale * car.offset * ROAD_W * W/2;
      const carY = p.screen.y;
      const carW = Math.max(scale * ROAD_W * W/2 * 0.46, 4);
      const carH = carW * 0.9;
      if(carY - carH > seg.clip) continue;   // 언덕 능선에 완전히 가려진 경우만 스킵
      // 능선(clip) 아래로 내려가는 부분만 잘라내고 그리기
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, seg.clip + 1);
      ctx.clip();
      drawCarSprite(carX, carY, carW, car.color, false, 0);
      ctx.restore();
    }
  }

  // 플레이어 차
  const steer = (left()? -1 : right()? 1 : 0) * clamp(state.speed/MAX_SPEED, 0, 1);
  const bounce = Math.sin(performance.now()/40) * clamp(state.speed/MAX_SPEED,0,1) * 1.6;
  drawCarSprite(W/2, H - 38 + bounce, 150, ['#e8543f','#b93a28'], true, steer);

  // 속도감 라인
  const sp = state.speed/MAX_SPEED;
  if(sp > 0.7){
    ctx.strokeStyle = `rgba(255,255,255,${(sp-0.7)*0.9})`;
    ctx.lineWidth = 2;
    for(let i=0;i<8;i++){
      const a = Math.random()*Math.PI*2;
      const r1 = 280 + Math.random()*60, r2 = r1 + 50 + Math.random()*80;
      ctx.beginPath();
      ctx.moveTo(W/2 + Math.cos(a)*r1, H/2 + Math.sin(a)*r1*0.7);
      ctx.lineTo(W/2 + Math.cos(a)*r2, H/2 + Math.sin(a)*r2*0.7);
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* ---------- 업데이트 ---------- */
function updateTraffic(dt, playerSeg){
  for(const car of traffic){
    const oldSeg = findSegment(car.z);
    car.z += car.speed * dt;
    if(car.z >= trackLength) { car.z -= trackLength; car.passed = false; }
    const newSeg = findSegment(car.z);
    if(oldSeg !== newSeg){
      const idx = oldSeg.cars.indexOf(car);
      if(idx>-1) oldSeg.cars.splice(idx,1);
      newSeg.cars.push(car);
    }
    // 추월 점수
    if(!car.passed){
      const rel = (car.z - state.position + trackLength) % trackLength;
      if(rel > trackLength*0.5){ // 플레이어가 지나침
        car.passed = true;
        if(state.speed > car.speed){
          state.passCount++;
          state.score += 200;
          flashMsg('+200 추월!');
        }
      }
    }
  }
}

function update(dt){
  const playerSeg = findSegment(state.position + CAM_DEPTH*CAM_H);
  const spRatio = state.speed/MAX_SPEED;

  // 조향
  const dx = dt * 2.1 * spRatio;
  if(left())  state.playerX -= dx;
  if(right()) state.playerX += dx;
  // 커브 원심력
  state.playerX -= dx * spRatio * playerSeg.curve * 0.32;

  // 가감속
  if(up())        state.speed += ACCEL * dt;
  else if(down()) state.speed += BRAKE * dt;
  else            state.speed += DECEL * dt;

  // 오프로드
  if((state.playerX < -1.05 || state.playerX > 1.05)){
    if(state.speed > OFFROAD_LIMIT) state.speed += OFFROAD_DECEL * dt;
    state.shake = Math.max(state.shake, 4*spRatio);
  }
  state.playerX = clamp(state.playerX, -1.6, 1.6);
  state.speed = clamp(state.speed, 0, MAX_SPEED);

  // 충돌 검사
  for(const car of playerSeg.cars){
    if(state.speed <= car.speed) continue;
    if(Math.abs(state.playerX - car.offset) < 0.34){
      state.speed = car.speed * 0.55;
      state.position = car.z - SEG_LEN*2;
      if(state.position<0) state.position += trackLength;
      state.shake = 14;
      state.score = Math.max(0, state.score - 100);
      flashMsg('충돌! -100');
      break;
    }
  }

  // 전진
  const move = state.speed * dt;
  state.position += move;
  while(state.position >= trackLength) state.position -= trackLength;
  state.totalDist += move;

  // 점수(거리 비례)
  state.score += Math.round(move * 0.01 * (1 + spRatio));

  // 체크포인트
  if(state.totalDist >= state.nextCheckpoint){
    state.nextCheckpoint += CHECKPOINT_DIST;
    state.timeLeft += CHECKPOINT_TIME;
    state.score += 500;
    flashMsg('체크포인트! +' + CHECKPOINT_TIME + '초');
  }

  // 시간
  state.timeLeft -= dt;
  if(state.timeLeft <= 0){
    state.timeLeft = 0;
    gameOver();
  }

  state.shake = Math.max(0, state.shake - dt*30);
  updateTraffic(dt, playerSeg);
}

/* ---------- HUD ---------- */
const $ = id => document.getElementById(id);
let msgTimer = null;
function flashMsg(text){
  const m = $('msg');
  m.textContent = text;
  m.style.opacity = 1;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(()=> m.style.opacity = 0, 900);
}
function updateHUD(){
  $('speedVal').textContent = Math.round(state.speed/MAX_SPEED * 240);
  $('timeVal').textContent = state.timeLeft.toFixed(1);
  $('distVal').textContent = (state.totalDist/ (SEG_LEN*60) ).toFixed(1);
  $('scoreVal').textContent = state.score.toLocaleString();
  $('bestVal').textContent = state.best.toLocaleString();
}

/* ---------- 게임 흐름 ---------- */
function startGame(){
  buildTrack();
  spawnTraffic(26);
  for(const car of traffic) findSegment(car.z).cars.push(car);
  Object.assign(state,{
    running:true, paused:false, over:false,
    position:0, playerX:0, speed:0,
    totalDist:0, timeLeft:60, score:0,
    passCount:0, nextCheckpoint:CHECKPOINT_DIST, shake:0
  });
  $('startOverlay').classList.add('hidden');
  $('overOverlay').classList.add('hidden');
  flashMsg('GO!');
}
function gameOver(){
  state.over = true;
  state.running = false;
  state.best = Math.max(state.best, state.score);
  $('finalScore').textContent = state.score.toLocaleString();
  $('finalDist').textContent = (state.totalDist/(SEG_LEN*60)).toFixed(1);
  $('finalPass').textContent = state.passCount;
  $('overTitle').textContent = 'TIME OVER';
  $('overOverlay').classList.remove('hidden');
  updateHUD();
}
function togglePause(){
  state.paused = !state.paused;
  flashMsg(state.paused ? '일시정지 (P로 재개)' : '재개!');
}

$('startBtn').addEventListener('click', startGame);
$('retryBtn').addEventListener('click', startGame);

/* ---------- 메인 루프 ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min((now-last)/1000, 1/25);
  last = now;
  if(state.running && !state.paused && !state.over){
    update(dt);
    updateHUD();
  }
  render();
  requestAnimationFrame(frame);
}
buildTrack();
spawnTraffic(26);
for(const car of traffic) findSegment(car.z).cars.push(car);
requestAnimationFrame(frame);
</script>
